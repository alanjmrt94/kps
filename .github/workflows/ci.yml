name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias dev
        run: pip install ".[dev]"
      - name: Pylint
        run: python -m pylint kps.py utils/*.py

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar paquete y deps dev
        run: pip install ".[dev]"
      - name: Pytest con cobertura
        run: python -m pytest

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar paquete y deps dev
        run: pip install ".[dev]"
      - name: Pytest (sin cobertura mínima en Windows)
        run: python -m pytest --cov-fail-under=0
