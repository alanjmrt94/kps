name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias dev
        run: pip install ".[dev]"
      - name: Pylint
        run: python -m pylint kps.py utils/*.py tests/*.py

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar mypy
        run: pip install mypy
      - name: mypy
        run: python -m mypy

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar paquete y deps dev
        run: pip install ".[dev]"
      - name: Pytest con cobertura
        run: python -m pytest

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar paquete y deps dev
        run: pip install ".[dev]"
      - name: Pytest (idle Linux no importable en Windows)
        run: python -m pytest --cov-fail-under=0

  build-appimage:
    # El AppImage se construye dentro de ubuntu:18.04 (glibc 2.27) vía Docker
    # para correr en Ubuntu 18.04–26.04. El runner solo necesita Docker.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Build AppImage (Ubuntu 18.04 / glibc 2.27)
        run: bash scripts/build_appimage.sh
      - name: Smoke test
        run: ./dist/kps-x86_64.AppImage -h
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: kps-x86_64-appimage
          path: |
            dist/kps-x86_64.AppImage
            dist/kps-x86_64.AppImage.zsync
          retention-days: 14
          if-no-files-found: error
